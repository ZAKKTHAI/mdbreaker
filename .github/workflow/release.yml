name: Release AppImage

on:
  push:
    # "v1.0.0" のようなバージョンタグ（tag）がコミットされた時に自動実行する設定
    tags:
      - 'v*'
  # GitHubの画面から手動で実行したい場合もオンにする設定
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write # GitHub Releasesを作成・編集するために必須の権限
    runs-on: ubuntu-latest

    steps:
      # 1. ソースコードのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 環境のセットアップ (フロントエンド用)
      - name: Setup Node.js
        uses: actions/abstract-javascript/setup-node@v2 # または actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Rust 環境のセットアップ (Tauriコア用)
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 4. Linux(Ubuntu) で Tauri をビルドするために必要なシステム依存ライブラリのインストール
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # 5. フロントエンドのパッケージインストール (npm の例。pnpm や yarn なら適宜変更)
      - name: Install frontend dependencies
        run: npm install

      # 6. Tauri公式のActionを使い、ビルドからGitHub Releaseへのアップロードまでを自動化
      - name: Build and Release AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 権限用トークン (自動で適用されます)
        with:
          tagName: ${{ github.ref_name }} # タグ名をリリース名にする
          releaseName: 'AppImage Release ${{ github.ref_name }}'
          releaseBody: 'Tauriで自動ビルドされた Linux 用 AppImage です。'
          releaseDraft: true # 最初は「下書き(Draft)」として保存されるので安心です
          prerelease: false
